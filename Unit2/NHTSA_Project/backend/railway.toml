# Railway deploy configuration for the NHTSA Project FastAPI backend.
#
# This file is committed at the build root that Railway sees AFTER the service's
# Root Directory is set to `Unit2/NHTSA_Project/backend` in the Railway dashboard.
# Railway cannot configure the Root Directory itself via this file — that lives
# in Service Settings — but everything below (build / start / healthcheck) is
# read by Railway on every deploy and overrides the dashboard equivalents,
# making the deploy reproducible from git.
#
# Why this exists at all
# ----------------------
# Without a railway.toml, Railway's Nixpacks builder still works: it auto-detects
# Python, installs requirements.txt, and runs `uvicorn main:app` because the
# repo has a top-level `app = FastAPI()`. But three behaviours are then implicit
# (whatever the Nixpacks defaults are at deploy time) instead of explicit:
#
#   - the exact uvicorn invocation (host, port binding, worker count)
#   - whether Railway probes /health for readiness
#   - what Railway does on a crash (restart? back off? give up?)
#
# Pinning them here means a future Railway / Nixpacks default change can't
# silently alter how this service runs.

[build]
# Use Railway's standard Nixpacks builder. Detects requirements.txt + the
# .python-version file in this directory and builds a Python image.
builder = "NIXPACKS"

[deploy]
# Railway's service Root Directory should be `Unit2/NHTSA_Project` so the
# deployment image includes the sibling packages imported by pipeline_runner
# (`Project_Tools/`, `LangGraph/`, and `LLM_Tools/`). Because the FastAPI ASGI
# entrypoint still lives in `backend/main.py`, the runtime command must enter
# `backend/` before asking uvicorn to import `main:app`.
#   - host=0.0.0.0 binds to every interface (Railway routes traffic to the
#     container via its internal proxy; binding to 127.0.0.1 would be invisible)
#   - port=$PORT  — Railway injects $PORT at runtime; uvicorn must use exactly
#     that value or the platform's healthcheck and routing will fail
# We do NOT pass --workers; the asyncio.Semaphore in main.py assumes ONE
# worker, and an 8 GB Hobby instance has no need to fan out for this workload.
startCommand = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"

# Railway pings this path after each deploy to gate traffic rollover. If the
# probe fails (non-2xx) the new deploy is held back and the old one keeps
# serving — exactly what we want when a bad commit ships.
healthcheckPath = "/health"
# 100s gives the FastAPI startup chain (langgraph compile + first import of
# pandas/pyarrow/openai SDKs) plenty of room on a cold start without
# producing false-negative readiness failures.
healthcheckTimeout = 100

# On crash, restart up to 10 times before giving up and showing the failure
# in the dashboard. Useful for transient OOMs while we shake the build out;
# can be tightened to a smaller number once the deploy is stable.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
